{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}<main class="form-shell"><div class="form-card"><h1>Login</h1><p class="muted">Access your own profile dashboard or the admin review panel.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<div class="field"><label>Email</label><input class="input" type="email" name="email" required></div>
<div class="field"><label>Password</label><input class="input" type="password" name="password" required></div>
<button class="btn primary" type="submit">Login</button></form></div></main>{% endblock %}
