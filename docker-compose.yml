services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uksf
      POSTGRES_USER: uksf
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uksf -d uksf"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://uksf:change-me@db:5432/uksf
      SECRET_KEY: local-dev-only-change-me
      BASE_URL: http://localhost:8000
      SESSION_HTTPS_ONLY: "false"
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/app/uploads
      - qr_codes:/app/app/generated_qr
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
  qr_codes:
